<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket Option AI Autotrading</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 16px;
        }
        h2 { text-align: center; margin-bottom: 20px; color: #58a6ff; }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 15px;
        }
        .btn {
            background: #238636;
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn:active { background: #2ea043; }
        .pair-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }
        .pair-btn {
            background: #21262d;
            border: 1px solid #30363d;
            color: white;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
        }
        .pair-btn.active {
            border-color: #58a6ff;
            background: #1f6feb;
        }
    </style>
</head>
<body>

    <h2>🤖 AI Autotrading App</h2>

    <div class="card">
        <h3>1. Sélectionnez la Paire OTC</h3>
        <div class="pair-grid">
            <div class="pair-btn active" onclick="selectPair(this)">EUR/USD</div>
            <div class="pair-btn" onclick="selectPair(this)">AUD/CAD</div>
            <div class="pair-btn" onclick="selectPair(this)">USD/JPY</div>
        </div>
    </div>

    <div class="card">
        <h3>2. Mode de Risque & Martingale</h3>
        <label><input type="radio" name="mode" checked> Phase 1 (Mise 5$ | Obj: +30$)</label><br><br>
        <label><input type="radio" name="mode"> Phase 2 (Mise 15$ | Obj: +50$)</label><br><br>
        <label><input type="radio" name="mode"> Phase 3 (Mise 50$ | Obj: +250$)</label>
    </div>

    <button class="btn" onclick="lancerAutotrading()">LANCER EN DÉMO / AUTO</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // Agrandir la webapp en plein écran dans Telegram

        function selectPair(element) {
            document.querySelectorAll('.pair-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
        }

        function lancerAutotrading() {
            tg.sendData("LANCER_AUTOTRADING_ACTION"); // Renvoie l'info au bot Telegram
            alert("Initialisation de l'autotrading en cours...");
        }
    </script>
</body>
</html>
